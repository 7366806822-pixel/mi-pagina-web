function scenes(mode){if(!S.scriptSel&&S.scripts[0])S.scriptSel=S.scripts[0].id;let s=S.scripts.find(x=>x.id===S.scriptSel),a=S.scenes.filter(x=>x.script_id===S.scriptSel).sort((a,b)=>a.scene_number-b.scene_number);$('#view').innerHTML=`<div class="head"><div><h2>${mode==='prompts'?'Prompts audiovisuales':mode==='visuals'?'Visuales':'Storyboard'}</h2><p>Conserva rostro, ropa, voz, objetos, lugar, posición e iluminación.</p></div><div class="toolbar"><select class="select sm" id="selS"><option value="">Selecciona guion…</option>${S.scripts.map(x=>`<option value="${x.id}" ${x.id===S.scriptSel?'selected':''}>${E(x.title)}</option>`).join('')}</select>${s?'<button class="btn primary" id="asc">+ Escena</button>':''}</div></div>${s?`<div class="call"><b>${E(s.title)}</b> · ${wc(voice(s))} palabras · ${secs(wc(voice(s)),s.words_per_minute)} s estimados</div><div class="list" style="margin-top:12px">${a.length?a.map(sc=>sceneCard(sc,mode)).join(''):`<div class="empty card"><b>Sin escenas.</b></div>`}</div>`:`<div class="empty card"><b>No hay guiones.</b></div>`}`;let sel=$('#selS');if(sel)sel.onchange=e=>{S.scriptSel=e.target.value;scenes(mode)};let add=$('#asc');if(add)add.onclick=()=>sceneM(s,a.length+1);$$('[data-esc]').forEach(b=>b.onclick=()=>sceneM(s,null,S.scenes.find(x=>x.id===b.dataset.esc)));$$('[data-dsc]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar escena?'))try{await del('future_scenes',b.dataset.dsc);toast('Escena eliminada.')}catch(e){toast(e.message,true)}})}function sceneCard(sc,m){let body=m==='prompts'?`<p class="small"><b>Prompt:</b> ${E(sc.audiovisual_prompt||'Sin prompt')}</p><p class="small muted"><b>Negativo:</b> ${E(sc.negative_prompt||neg)}</p>`:m==='visuals'?`<p class="small"><b>Acción:</b> ${E(sc.visual_action||'—')}</p><p class="small muted">${E([sc.character_desc,sc.setting_desc,sc.lighting].filter(Boolean).join(' · '))}</p>`:`<p class="small"><b>Narración:</b> ${E(sc.narration||'—')}</p><p class="small muted">${E(sc.visual_action||'Sin acción visual')} · ${E(sc.camera_movement||'Sin movimiento')}</p>`;return `<div class="scene"><div class="toolbar" style="justify-content:space-between"><div><span class="badge blue">Escena ${sc.scene_number}</span> <span class="small muted">${sc.start_second}s–${sc.end_second}s</span></div><div><button class="btn" data-esc="${sc.id}">Editar</button> <button class="btn danger" data-dsc="${sc.id}">Eliminar</button></div></div>${body}</div>`}function sceneM(s,n,sc={}){modal(sc.id?'Editar escena':'Nueva escena',`<form id="scf"><div class="form"><div class="field"><label>Número</label><input class="input" type="number" min="1" name="scene_number" value="${sc.scene_number||n||1}"></div><div class="field"><label>Inicio / fin</label><div class="toolbar"><input class="input" style="width:46%" type="number" step=".1" name="start_second" value="${sc.start_second||0}"><input class="input" style="width:46%" type="number" step=".1" name="end_second" value="${sc.end_second||10}"></div></div>${[['narration','Narración'],['visual_action','Acción visual'],['character_desc','Personaje / continuidad'],['setting_desc','Escenario'],['main_object','Objeto principal'],['framing','Encuadre'],['lighting','Iluminación'],['camera_movement','Movimiento de cámara'],['transition_desc','Transición'],['sound_desc','Música / sonido'],['edit_text','Texto de edición'],['audiovisual_prompt','Prompt audiovisual']].map(([k,l])=>`<div class="field full"><label>${l}</label><textarea class="textarea" name="${k}">${E(sc[k]||'')}</textarea></div>`).join('')}<div class="field full"><label>Prompt negativo</label><textarea class="textarea" name="negative_prompt">${E(sc.negative_prompt||neg)}</textarea></div></div><div class="actions"><button class="btn primary">Guardar escena</button></div></form>`);$('#scf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.currentTarget));p.script_id=s.id;p.scene_number=Number(p.scene_number);p.start_second=Number(p.start_second);p.end_second=Number(p.end_second);try{sc.id?await upd('future_scenes',sc.id,p):await ins('future_scenes',p);closeM();toast('Escena guardada.')}catch(x){toast(x.message,true)}}}
function production(){let cols=['detectado','investigando','verificando','verificado','guion','produccion','revision','programado','publicado'];$('#view').innerHTML=`<div class="call">Arrastra una tarjeta para actualizar el estado; el cambio se guarda en la nube.</div><div class="head"><div><h2>Kanban editorial</h2><p>Del hallazgo a la publicación.</p></div></div><div class="pipeline">${cols.map(c=>`<div class="col" data-st="${c}"><div class="colh"><span>${lab(c)}</span><b>${S.radar.filter(r=>r.status===c).length}</b></div>${S.radar.filter(r=>r.status===c).map(r=>`<div class="tile" draggable="true" data-id="${r.id}"><b>${E(r.title)}</b><div class="muted">${E(r.category)} · ${score(r)}/100</div></div>`).join('')}</div>`).join('')}</div>`;let drag=null;$$('.tile').forEach(x=>x.ondragstart=()=>drag=x.dataset.id);$$('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('drag')};c.ondragleave=()=>c.classList.remove('drag');c.ondrop=async e=>{e.preventDefault();c.classList.remove('drag');if(drag)try{await upd('future_radar_items',drag,{status:c.dataset.st});toast('Estado actualizado.')}catch(x){toast(x.message,true)}}})}
function pubMini(){let a=[...S.publications].filter(p=>p.scheduled_at).sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at)).slice(0,5);return `<div class="card tablewrap">${a.length?`<table class="table"><thead><tr><th>Fecha</th><th>Título</th><th>Plataforma</th><th>Estado</th></tr></thead><tbody>${a.map(p=>`<tr><td>${fmtd(p.scheduled_at)}</td><td>${E(p.title)}</td><td>${E(lab(p.platform))}</td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><b>Sin publicaciones programadas.</b></div>`}</div>`}
function calendar(){let n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),days=[];for(let i=0;i<first.getDay();i++)days.push(null);for(let d=1;d<=last.getDate();d++)days.push(new Date(y,m,d));$('#view').innerHTML=`<div class="head"><div><h2>${new Intl.DateTimeFormat('es-PE',{month:'long',year:'numeric'}).format(n)}</h2><p>Publicaciones programadas</p></div><button class="btn primary" id="cap">+ Programar</button></div><div class="calendar">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<div class="small muted">${x}</div>`).join('')}${days.map(d=>d?`<div class="day"><div class="small muted">${d.getDate()}</div>${S.publications.filter(p=>p.scheduled_at&&new Date(p.scheduled_at).toDateString()===d.toDateString()).map(p=>`<div class="event">${E(lab(p.platform))}<br><b>${E(p.title)}</b></div>`).join('')}</div>`:'<div></div>').join('')}</div>`;$('#cap').onclick=pubM}
function pubs(){$('#view').innerHTML=`<div class="head"><div><h2>Publicaciones</h2><p>Metadatos específicos por plataforma.</p></div><button class="btn primary" id="apub">+ Publicación</button></div><div class="card tablewrap">${S.publications.length?`<table class="table"><thead><tr><th>Título</th><th>Plataforma</th><th>Programación</th><th>Publicado</th><th>Estado</th><th>URL</th><th></th></tr></thead><tbody>${S.publications.map(p=>`<tr><td><b>${E(p.title)}</b><div class="small muted">${E((p.hashtags||'').slice(0,80))}</div></td><td>${E(lab(p.platform))}</td><td>${fmtd(p.scheduled_at)}</td><td>${fmtd(p.published_at)}</td><td>${badge(p.status)}</td><td>${p.publication_url?`<a target="_blank" rel="noopener" class="muted" href="${E(p.publication_url)}">Abrir</a>`:'—'}</td><td><button class="btn danger" data-dp="${p.id}">Eliminar</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><b>Sin publicaciones.</b></div>`}</div>`;$('#apub').onclick=pubM;$$('[data-dp]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar publicación y métricas?'))try{await del('future_publications',b.dataset.dp);toast('Publicación eliminada.')}catch(e){toast(e.message,true)}})}
function pubM(){modal('Nueva publicación',`<form id="pf"><div class="form"><div class="field"><label>Guion</label><select class="select" name="script_id"><option value="">Sin asociar</option>${S.scripts.map(s=>`<option value="${s.id}">${E(s.title)}</option>`).join('')}</select></div><div class="field"><label>Plataforma</label><select class="select" name="platform">${['youtube_shorts','tiktok','instagram_reels','facebook_reels','otra'].map(x=>`<option value="${x}">${lab(x)}</option>`).join('')}</select></div><div class="field full"><label>Título *</label><input class="input" name="title" required></div><div class="field full"><label>Descripción</label><textarea class="textarea" name="description"></textarea></div><div class="field full"><label>Hashtags</label><input class="input" name="hashtags"></div><div class="field"><label>Texto portada</label><input class="input" name="cover_text"></div><div class="field"><label>Estado</label><select class="select" name="status"><option>borrador</option><option selected>programado</option><option>publicado</option><option>archivado</option></select></div><div class="field"><label>Programado</label><input class="input" type="datetime-local" name="scheduled_at"></div><div class="field"><label>Publicado</label><input class="input" type="datetime-local" name="published_at"></div><div class="field full"><label>URL</label><input class="input" type="url" name="publication_url"></div></div><div class="actions"><button class="btn primary">Guardar</button></div></form>`);$('#pf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.currentTarget));p.script_id=p.script_id||null;p.scheduled_at=p.scheduled_at?new Date(p.scheduled_at).toISOString():null;p.published_at=p.published_at?new Date(p.published_at).toISOString():null;p.publication_url=p.publication_url||null;try{await ins('future_publications',p);closeM();toast('Publicación guardada.')}catch(x){toast(x.message,true)}}}
function metrics(){let latest={};[...S.metrics].sort((a,b)=>new Date(b.measured_at)-new Date(a.measured_at)).forEach(m=>{if(!latest[m.publication_id])latest[m.publication_id]=m});let a=Object.values(latest);$('#view').innerHTML=`<div class="head"><div><h2>Métricas</h2><p>Datos reales ingresados por publicación.</p></div><button class="btn primary" id="am">+ Medición</button></div><div class="grid g2"><div class="card pad"><h3 style="font-size:13px">Resumen</h3>${a.length?a.map(m=>`<div style="margin:10px 0"><div class="small" style="display:flex;justify-content:space-between"><span>${E((S.publications.find(p=>p.id===m.publication_id)?.title||'Publicación').slice(0,30))}</span><b>${num(m.views)} vistas</b></div><div class="progress" style="margin-top:6px"><span style="width:${Math.min(100,Number(m.retention_final||0))}%"></span></div><div class="small muted">Retención final ${m.retention_final||0}%</div></div>`).join(''):`<div class="empty">Sin mediciones.</div>`}</div><div class="card pad"><h3 style="font-size:13px">Diagnóstico</h3>${a.length>=3?diag(a):`<div class="call warn">Se requieren al menos 3 publicaciones con métricas para comparar resultados.</div>`}</div></div><div class="head"><div><h2>Historial</h2></div></div><div class="card tablewrap">${S.metrics.length?`<table class="table"><thead><tr><th>Publicación</th><th>Fecha</th><th>Vistas</th><th>Ret. 3s</th><th>Ret. 10s</th><th>Ret. final</th><th>Engagement</th></tr></thead><tbody>${S.metrics.map(m=>`<tr><td>${E(S.publications.find(p=>p.id===m.publication_id)?.title||'—')}</td><td>${fmtd(m.measured_at)}</td><td>${num(m.views)}</td><td>${m.retention_3s}%</td><td>${m.retention_10s}%</td><td>${m.retention_final}%</td><td>${m.engagement}%</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Sin datos.</div>`}</div>`;$('#am').onclick=metricM}function diag(a){let b=[...a].sort((x,y)=>Number(y.retention_final||0)-Number(x.retention_final||0))[0],p=S.publications.find(x=>x.id===b.publication_id);return `<div class="call"><b>Mejor retención final registrada:</b><br>${E(p?.title||'Publicación')} · ${b.retention_final}%<br><br>Esto describe tus datos; no demuestra causalidad.</div>`}function metricM(){if(!S.publications.length){toast('Primero registra una publicación.',true);return}modal('Registrar métricas',`<form id="mf"><div class="form"><div class="field full"><label>Publicación</label><select class="select" name="publication_id">${S.publications.map(p=>`<option value="${p.id}">${E(p.title)} · ${lab(p.platform)}</option>`).join('')}</select></div>${[['views','Vistas'],['reach','Alcance'],['impressions','Impresiones'],['avg_view_seconds','Duración media s'],['percent_viewed','% visto'],['retention_3s','Retención 3 s %'],['retention_10s','Retención 10 s %'],['retention_50','Retención 50 %'],['retention_final','Retención final %'],['likes','Likes'],['comments','Comentarios'],['shares','Compartidos'],['saves','Guardados'],['followers_gained','Seguidores'],['clicks','Clics'],['engagement','Engagement %']].map(([k,l])=>`<div class="field"><label>${l}</label><input class="input" type="number" step=".01" min="0" name="${k}" value="0"></div>`).join('')}<div class="field full"><label>Notas</label><textarea class="textarea" name="notes"></textarea></div></div><div class="actions"><button class="btn primary">Guardar</button></div></form>`);$('#mf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.currentTarget));Object.keys(p).filter(k=>!['publication_id','notes'].includes(k)).forEach(k=>p[k]=Number(p[k]||0));try{await ins('future_metrics',p);closeM();toast('Métricas guardadas.')}catch(x){toast(x.message,true)}}}
function experiments(){$('#view').innerHTML=`<div class="grid g2"><div class="card pad"><h2 style="font-size:14px">Experimentos A/B</h2><p class="small muted">Compara hooks, títulos, miniaturas, duración y CTA.</p><div class="call warn"><b>Sin simulación.</b><br>Para atribuir resultados con rigor se necesitan variantes publicadas y métricas comparables. Registra cada variante como publicación y documenta el aprendizaje.</div></div><div class="card pad"><h2 style="font-size:14px">Regla experimental</h2><ol class="small muted" style="line-height:1.8"><li>Cambia una sola variable.</li><li>Define la métrica principal antes de publicar.</li><li>Mantén tema y ventana temporal comparables.</li><li>No declares ganador con muestra insuficiente.</li></ol></div></div>`}
function library(){let q=S.search.toLowerCase(),a=[...S.radar.map(x=>({t:'Radar',title:x.title,text:[x.summary,x.category,x.organization].join(' '),d:x.detected_at})),...S.scripts.map(x=>({t:'Guion',title:x.title,text:voice(x),d:x.updated_at})),...S.publications.map(x=>({t:'Publicación',title:x.title,text:[x.description,x.hashtags].join(' '),d:x.published_at||x.scheduled_at}))].filter(x=>!q||[x.t,x.title,x.text].join(' ').toLowerCase().includes(q));$('#view').innerHTML=`<div class="head"><div><h2>Biblioteca histórica</h2><p>Busca antes de repetir un tema.</p></div><input class="input sm" id="ls" value="${E(S.search)}" placeholder="Buscar…"></div><div class="list">${a.length?a.map(x=>`<div class="li"><span class="badge blue">${x.t}</span> <span class="small muted">${fmt(x.d)}</span><h3 style="font-size:13px;margin:7px 0">${E(x.title)}</h3><p class="small muted">${E((x.text||'').slice(0,200))}</p></div>`).join(''):`<div class="empty card"><b>Sin coincidencias.</b></div>`}</div>`;$('#ls').oninput=e=>{S.search=e.target.value;library()}}
function learnings(){$('#view').innerHTML=`<div class="head"><div><h2>Aprendizajes</h2><p>Qué funcionó, qué falló y cómo aplicarlo.</p></div><button class="btn primary" id="al">+ Aprendizaje</button></div><div class="grid g2">${S.learnings.length?S.learnings.map(l=>`<div class="card pad"><div class="small muted">${fmt(l.created_at)}</div><h3 style="font-size:13px">${E(l.learning)}</h3><p class="small muted"><b>Resultado:</b> ${E(l.result||'—')}</p><p class="small muted"><b>Aplicación:</b> ${E(l.future_application||'—')}</p></div>`).join(''):`<div class="empty card" style="grid-column:1/-1"><b>Sin aprendizajes.</b></div>`}</div>`;$('#al').onclick=learningM}function learningM(){modal('Registrar aprendizaje',`<form id="lf"><div class="form"><div class="field"><label>Publicación</label><select class="select" name="publication_id"><option value="">Sin asociar</option>${S.publications.map(p=>`<option value="${p.id}">${E(p.title)}</option>`).join('')}</select></div><div></div>${[['what_worked','Qué funcionó'],['what_failed','Qué no funcionó'],['hypothesis','Hipótesis'],['result','Resultado'],['learning','Aprendizaje *'],['future_application','Aplicación futura']].map(([k,l])=>`<div class="field full"><label>${l}</label><textarea class="textarea" name="${k}" ${k==='learning'?'required':''}></textarea></div>`).join('')}</div><div class="actions"><button class="btn primary">Guardar</button></div></form>`);$('#lf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.currentTarget));p.publication_id=p.publication_id||null;try{await ins('future_learnings',p);closeM();toast('Aprendizaje guardado.')}catch(x){toast(x.message,true)}}}
function settings(){let s=S.settings||{};$('#view').innerHTML=`<div class="grid g2"><div class="card pad"><h2 style="font-size:14px">Configuración editorial</h2><form id="setf"><div class="field"><label>Nombre</label><input class="input" name="project_name" value="${E(s.project_name||'FUTURO EN MINUTO')}"></div><div class="field" style="margin-top:10px"><label>PPM por defecto</label><select class="select" name="default_wpm">${[130,140,150,160].map(x=>`<option ${Number(s.default_wpm)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>CTA</label><textarea class="textarea" name="default_cta">${E(s.default_cta||'')}</textarea></div><div class="actions"><button class="btn primary">Guardar</button></div></form></div><div class="card pad"><h2 style="font-size:14px">Estado técnico</h2><div class="list"><div class="li"><b>Base de datos</b><p class="small muted">Supabase · persistencia real en nube</p></div><div class="li"><b>Acceso</b><p class="small muted">Modo personal directo · sin login</p></div><div class="li"><b>IA</b><p class="small muted">Pendiente de credenciales; no se simula</p></div><div class="li"><b>Radar automático</b><p class="small muted">Pendiente de fuentes/APIs; radar manual funcional</p></div></div><div class="call warn" style="margin-top:12px">El modo directo prioriza acceso inmediato. Para información privada o equipos, conviene activar autenticación y políticas por usuario.</div></div></div>`;$('#setf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.currentTarget));p.default_wpm=Number(p.default_wpm);try{await upd('future_settings',s.id,p);toast('Configuración guardada.')}catch(x){toast(x.message,true)}}}
function newGlobal(){({radar:()=>radarM(),sources:sourceM,ideas:ideaM,scripts:()=>scriptM({}),calendar:pubM,publications:pubM,metrics:metricM,learnings:learningM}[S.route]||(()=>radarM()))()}
$('#newBtn').onclick=newGlobal;$('#openSide').onclick=()=>$('#side').classList.add('open');$('#closeSide').onclick=()=>$('#side').classList.remove('open');function tick(){$('#clock').textContent=new Intl.DateTimeFormat('es-PE',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}tick();setInterval(tick,1000);nav();load();
</script>
