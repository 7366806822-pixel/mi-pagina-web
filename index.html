<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>Mi Día a Día — Compartido</title>
<style>
:root{--bg:#07111f;--p:#0f1d2e;--p2:#13263a;--tx:#f7f9fc;--mu:#9eacbd;--ln:#26384d;--blue:#2d75ba;--gold:#d2b46c;--red:#ed5b52;--green:#24a66a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101d,#0b1e31);color:var(--tx);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#071522e8;border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:0 6px 18px;border-bottom:1px solid var(--ln)}.mark{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--gold);color:#07111f;font-weight:900}.brand b{font-size:14px;letter-spacing:.7px}.brand small{display:block;color:var(--mu);font-size:10px;margin-top:2px}.nav{display:grid;gap:4px;margin-top:14px}.nav button{border:1px solid transparent;background:transparent;color:#c8d3df;text-align:left;padding:10px;border-radius:7px}.nav button:hover,.nav button.on{background:#15304a;border-color:#284664}.cloudbox{position:absolute;left:12px;right:12px;bottom:16px;border:1px solid var(--ln);padding:10px;border-radius:8px;background:#0b1a29}.cloudbox strong{font-size:11px}.cloudbox span{display:block;color:var(--mu);font-size:9px;margin-top:4px}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 18px;background:#07111fd9;position:sticky;top:0;z-index:5}.top h1{font-size:19px;margin:0;margin-right:auto}.btn{border:1px solid var(--ln);background:#12263a;color:#e9f2fa;padding:9px 12px;border-radius:7px;font-weight:700}.btn.primary{background:linear-gradient(#347fc4,#225f99);border-color:#437faf}.btn.gold{background:#2b2618;color:#eed28e;border-color:#5d5030}.btn.danger{color:#ff9b95}.content{padding:18px;max-width:1450px;margin:auto}.hero{display:grid;grid-template-columns:1.6fr .8fr;gap:12px}.panel{border:1px solid var(--ln);background:#0f1d2ee8;border-radius:10px;padding:16px}.hero h2{font-size:26px;margin:6px 0}.muted{color:var(--mu);font-size:12px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--ln);background:#12263a;padding:13px;border-radius:8px}.stat span{font-size:9px;color:var(--mu);text-transform:uppercase}.stat b{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.field{width:100%;border:1px solid var(--ln);background:#0b1a2a;color:white;border-radius:7px;padding:10px}.toolbar .field{max-width:260px}.list{display:grid;gap:8px}.card{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--ln);background:#0b1a29;padding:12px;border-radius:8px}.card h3{font-size:13px;margin:0}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:9px;border:1px solid var(--ln);padding:3px 6px;border-radius:5px;color:#b8c6d5}.chip.high{color:#ff9892;border-color:#713b3b}.chip.mid{color:#f0bf6c;border-color:#65532e}.notes{font-size:10.5px;color:#9fb0c1;margin-top:7px;white-space:pre-wrap}.actions{display:flex;gap:5px;align-items:flex-start}.actions button{border:1px solid var(--ln);background:#13263a;color:#d9e4ef;padding:6px 8px;border-radius:5px;font-size:9px}.empty{text-align:center;padding:42px;color:#7890a7}.overlay{display:none;position:fixed;inset:0;background:#020912bf;z-index:20;padding:18px}.overlay.open{display:grid;place-items:center}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#0b1928;border:1px solid var(--ln);border-radius:12px;padding:18px}.modal h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{font-size:10px;color:#b5c1ce;margin-bottom:5px;display:block}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.shareLink{font-size:11px;word-break:break-all;background:#07111f;border:1px solid var(--ln);padding:10px;border-radius:7px;margin:10px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172b40;border:1px solid var(--ln);padding:10px 13px;border-radius:7px;display:none;z-index:50;font-size:11px}.toast.show{display:block}.warn{color:#ffb17a}.ok{color:#7ee0a9}@media(max-width:850px){.app{display:block}.side{position:static;height:auto}.cloudbox{position:static;margin-top:12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:10px;padding:8px 4px}.hero{grid-template-columns:1fr}.top{padding:0 10px}.top h1{font-size:16px}.content{padding:12px}}@media(max-width:580px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{grid-template-columns:1fr}.actions{justify-content:flex-end}.nav{grid-template-columns:repeat(2,1fr)}.top .btn.gold{display:none}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="mark">MD</div><div><b>MI DÍA A DÍA</b><small>Estudio jurídico · compartido</small></div></div><nav class="nav" id="nav"></nav><div class="cloudbox"><strong id="cloudTitle">Modo local</strong><span id="cloudText">Activa la nube para compartir el mismo espacio.</span></div></aside><main class="main"><header class="top"><h1 id="title">Hoy</h1><button class="btn" id="syncBtn">↻ Actualizar</button><button class="btn gold" id="shareBtn">☁ Compartir</button><button class="btn primary" id="addBtn">+ Agregar</button></header><div class="content" id="view"></div></main></div>
<div class="overlay" id="editOv"><section class="modal"><h2 id="editTitle">Nuevo registro</h2><input type="hidden" id="rid"><div class="grid"><div class="full"><label class="label">Título *</label><input id="fTitle" class="field" placeholder="Ej.: Audiencia de control, llamar a cliente..."></div><div><label class="label">Tipo</label><select id="fType" class="field"></select></div><div><label class="label">Prioridad</label><select id="fPriority" class="field"><option>Urgente</option><option>Alta</option><option selected>Media</option><option>Baja</option></select></div><div><label class="label">Estado</label><select id="fStatus" class="field"><option>Pendiente</option><option>En curso</option><option>En espera</option><option>Completado</option></select></div><div><label class="label">Cliente / responsable</label><input id="fClient" class="field"></div><div><label class="label">Fecha</label><input id="fDate" type="date" class="field"></div><div><label class="label">Hora</label><input id="fTime" type="time" class="field"></div><div class="full"><label class="label">Notas</label><textarea id="fNotes" class="field" rows="5"></textarea></div></div><div class="foot"><button class="btn" id="cancelBtn">Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div></section></div>
<div class="overlay" id="shareOv"><section class="modal"><h2>Compartir sistema</h2><p class="muted" id="shareInfo"></p><div id="shareArea"></div><div class="foot"><button class="btn" id="closeShare">Cerrar</button></div></section></div><div class="toast" id="toast"></div>
<script>
'use strict';
const TYPES=['Tarea','Cliente','Caso jurídico','Audiencia','Plazo procesal','Proyecto','Nota'];
const NAV=[['today','Hoy'],['agenda','Agenda'],['client','Clientes'],['case','Casos'],['hearing','Audiencias'],['deadline','Plazos'],['project','Proyectos'],['done','Completados']];
const MAP={client:'Cliente',case:'Caso jurídico',hearing:'Audiencia',deadline:'Plazo procesal',project:'Proyecto'};
const $=id=>document.getElementById(id), iso=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}, uid=()=>crypto.randomUUID?.()||Date.now()+'_'+Math.random().toString(36).slice(2);
let S={records:[],view:'today',db:'',busy:false,lastSync:0};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ts(r){return r.updatedAt||r.createdAt||''}
function active(){return S.records.filter(r=>!r.deletedAt)}
function saveLocal(){try{localStorage.setItem('mdd_shared_v7',JSON.stringify(S.records))}catch{}}
function loadLocal(){try{S.records=JSON.parse(localStorage.getItem('mdd_shared_v7')||'[]')}catch{S.records=[]}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function merge(a,b){let m=new Map();[...a,...b].forEach(r=>{let x=m.get(r.id);if(!x||ts(r)>ts(x))m.set(r.id,r)});return [...m.values()]}
function signature(rows){return rows.map(r=>r.id+'|'+ts(r)+'|'+(r.deletedAt||'')).sort().join('~')}
async function pull(show=true){if(!S.db){if(show)toast('Este espacio aún está en modo local.');return}if(S.busy)return;S.busy=true;cloud('Sincronizando…','');try{let res=await fetch(S.db,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();let rr=Array.isArray(data.records)?data.records:[];let before=signature(S.records),remoteSig=signature(rr);S.records=merge(S.records,rr);saveLocal();render();let mergedSig=signature(S.records);if(mergedSig!==remoteSig)await push(false);S.lastSync=Date.now();cloud('Nube activa','Sincronizado · '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}));if(show&&before!==mergedSig)toast('Información actualizada.');else if(show)toast('Todo está sincronizado.')}catch(e){cloud('Nube sin conexión','Se mantiene la copia local.');if(show)toast('No se pudo sincronizar ahora.')}finally{S.busy=false}}
async function push(show=false){if(!S.db)return;try{let res=await fetch(S.db,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:'Mi Dia a Dia',version:7,updatedAt:new Date().toISOString(),records:S.records})});if(!res.ok)throw Error();S.lastSync=Date.now();cloud('Nube activa','Cambios guardados en la nube.');if(show)toast('Guardado y sincronizado.')}catch{cloud('Pendiente de sincronizar','El cambio quedó guardado localmente.');if(show)toast('Guardado localmente; la nube no respondió.')}}
function cloud(a,b){$('cloudTitle').textContent=a;$('cloudText').textContent=b;$('cloudTitle').className=S.db?'ok':''}
async function enableCloud(){if(S.db){showShare();return}cloud('Creando espacio…','Conectando con la nube.');try{let res=await fetch('https://api.jsonstorage.net/v1/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:'Mi Dia a Dia',version:7,updatedAt:new Date().toISOString(),records:S.records})});if(!res.ok)throw Error('HTTP '+res.status);let d=await res.json();if(!d.uri)throw Error('Sin URI');S.db=d.uri;let u=new URL(location.href);u.searchParams.set('db',S.db);history.replaceState(null,'',u);cloud('Nube activa','Enlace compartido creado.');showShare();toast('Espacio compartido creado.')}catch(e){cloud('Modo local','No se pudo crear la nube.');toast('No se pudo activar la nube. Inténtalo de nuevo.')}}
function shareUrl(){let u=new URL(location.href);u.searchParams.set('db',S.db);return u.href}
function showShare(){$('shareOv').classList.add('open');if(!S.db){$('shareInfo').textContent='Activa un espacio compartido para que todas las personas que tengan el enlace vean y editen la misma información.';$('shareArea').innerHTML='<button class="btn primary" id="createCloud">Activar nube y generar enlace</button>';$('createCloud').onclick=enableCloud}else{$('shareInfo').textContent='Comparte este enlace por WhatsApp. Todos entrarán al mismo espacio.';$('shareArea').innerHTML='<div class="shareLink" id="linkText">'+esc(shareUrl())+'</div><button class="btn primary" id="copyLink">Copiar enlace</button>';$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl());toast('Enlace copiado.')}catch{prompt('Copia este enlace:',shareUrl())}}}}
function nav(){ $('nav').innerHTML=NAV.map(([k,l])=>'<button data-v="'+k+'" class="'+(S.view===k?'on':'')+'">'+l+'</button>').join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;nav();render()})}
function filtered(){let a=active(),today=iso();if(S.view==='today')return a.filter(r=>r.status!=='Completado'&&(r.date===today||r.priority==='Urgente'));if(S.view==='agenda')return a;if(S.view==='done')return a.filter(r=>r.status==='Completado');return a.filter(r=>r.type===MAP[S.view])}
function card(r){let p=(r.priority==='Urgente'||r.priority==='Alta')?'high':r.priority==='Media'?'mid':'';return '<article class="card"><div><h3>'+esc(r.title)+'</h3><div class="meta"><span class="chip">'+esc(r.type)+'</span><span class="chip '+p+'">'+esc(r.priority)+'</span><span class="chip">'+esc(r.status)+'</span>'+(r.date?'<span class="chip">'+esc(r.date)+(r.time?' · '+esc(r.time):'')+'</span>':'')+(r.client?'<span class="chip">'+esc(r.client)+'</span>':'')+'</div>'+(r.notes?'<div class="notes">'+esc(r.notes)+'</div>':'')+'</div><div class="actions"><button data-edit="'+r.id+'">Editar</button><button data-del="'+r.id+'">Eliminar</button></div></article>'}
function render(){let rows=filtered().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99'));let a=active(),today=iso(),open=a.filter(r=>r.status!=='Completado'),urgent=open.filter(r=>['Urgente','Alta'].includes(r.priority)),legal=open.filter(r=>['Caso jurídico','Audiencia','Plazo procesal'].includes(r.type));$('title').textContent=NAV.find(x=>x[0]===S.view)?.[1]||'Mi Día a Día';$('view').innerHTML='<section class="hero"><div class="panel"><div class="muted">CENTRO DE CONTROL COMPARTIDO</div><h2>Organiza el estudio jurídico y el día a día.</h2><p class="muted">Casos, clientes, audiencias, plazos, proyectos y tareas en un único espacio. El sistema abre aun cuando la nube esté temporalmente sin conexión.</p></div><div class="stats"><div class="stat"><span>Pendientes</span><b>'+open.length+'</b></div><div class="stat"><span>Prioridad alta</span><b>'+urgent.length+'</b></div><div class="stat"><span>Jurídicos</span><b>'+legal.length+'</b></div><div class="stat"><span>Para hoy</span><b>'+open.filter(r=>r.date===today).length+'</b></div></div></section><div class="toolbar"><input class="field" id="q" placeholder="Buscar..."><select class="field" id="pri"><option value="">Toda prioridad</option><option>Urgente</option><option>Alta</option><option>Media</option><option>Baja</option></select></div><section class="panel"><div class="list" id="list">'+(rows.length?rows.map(card).join(''):'<div class="empty">No hay registros en esta vista.</div>')+'</div></section>';bindRows(rows)}
function bindRows(base){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));let q=$('q'),p=$('pri');let apply=()=>{let s=q.value.toLowerCase(),pr=p.value,rows=base.filter(r=>(!s||JSON.stringify(r).toLowerCase().includes(s))&&(!pr||r.priority===pr));$('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">Sin resultados.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))};q.oninput=apply;p.onchange=apply}
function openEdit(id=''){let r=S.records.find(x=>x.id===id&&!x.deletedAt);$('rid').value=r?.id||'';$('editTitle').textContent=r?'Editar registro':'Nuevo registro';$('fTitle').value=r?.title||'';$('fType').value=r?.type||'Tarea';$('fPriority').value=r?.priority||'Media';$('fStatus').value=r?.status||'Pendiente';$('fClient').value=r?.client||'';$('fDate').value=r?.date||iso();$('fTime').value=r?.time||'';$('fNotes').value=r?.notes||'';$('editOv').classList.add('open');setTimeout(()=>$('fTitle').focus(),50)}
async function saveRecord(){let title=$('fTitle').value.trim();if(!title){toast('Escribe un título.');return}let id=$('rid').value||uid(),r=S.records.find(x=>x.id===id),now=new Date().toISOString(),obj={...(r||{}),id,title,type:$('fType').value,priority:$('fPriority').value,status:$('fStatus').value,client:$('fClient').value.trim(),date:$('fDate').value,time:$('fTime').value,notes:$('fNotes').value.trim(),createdAt:r?.createdAt||now,updatedAt:now,deletedAt:''};let i=S.records.findIndex(x=>x.id===id);if(i>=0)S.records[i]=obj;else S.records.push(obj);saveLocal();$('editOv').classList.remove('open');render();await push(true);bc?.postMessage('sync')}
async function del(id){if(!confirm('¿Eliminar este registro?'))return;let r=S.records.find(x=>x.id===id);if(!r)return;r.deletedAt=r.updatedAt=new Date().toISOString();saveLocal();render();await push(true);bc?.postMessage('sync')}
const bc='BroadcastChannel'in window?new BroadcastChannel('mdd_shared_v7'):null;if(bc)bc.onmessage=()=>pull(false);
async function init(){loadLocal();$('fType').innerHTML=TYPES.map(x=>'<option>'+x+'</option>').join('');let q=new URLSearchParams(location.search);S.db=q.get('db')||'';nav();render();if(S.db){cloud('Conectando…','Buscando la información compartida.');await pull(false)}else cloud('Modo local','Activa la nube para compartir el mismo espacio.');setInterval(()=>{if(S.db&&!document.hidden)pull(false)},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.db&&Date.now()-S.lastSync>5000)pull(false)})}
$('addBtn').onclick=()=>openEdit();$('syncBtn').onclick=()=>pull(true);$('shareBtn').onclick=showShare;$('cancelBtn').onclick=()=>$('editOv').classList.remove('open');$('saveBtn').onclick=saveRecord;$('closeShare').onclick=()=>$('shareOv').classList.remove('open');$('editOv').onclick=e=>{if(e.target===$('editOv'))$('editOv').classList.remove('open')};$('shareOv').onclick=e=>{if(e.target===$('shareOv'))$('shareOv').classList.remove('open')};init();
</script>
</body></html>
