<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1f3a">
  <title>Sistema Integral de Derecho Civil y Procesal Civil Peruano</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#132238}
    .boot{height:100%;display:grid;place-items:center;padding:24px}.box{width:min(560px,100%);background:#fff;border:1px solid #dce4ef;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(11,31,58,.08)}
    .bar{height:7px;background:#e8edf5;border-radius:999px;overflow:hidden}.bar:after{content:"";display:block;width:40%;height:100%;background:#0b1f3a;border-radius:inherit;animation:load 1.1s ease-in-out infinite alternate}.muted{color:#66758b}.error{color:#9b2c2c}
    @keyframes load{to{transform:translateX(150%)}}
  </style>
</head>
<body>
  <div class="boot"><div class="box"><h1>Sistema Integral de Derecho Civil y Procesal Civil Peruano</h1><p id="status" class="muted">Cargando plataforma jurídica verificada…</p><div class="bar"></div></div></div>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      if(!('DecompressionStream' in window)) throw new Error('Este navegador no admite la descompresión requerida. Utiliza una versión moderna de Chrome, Edge, Firefox o Safari.');
      const files=['p00.txt','p01.txt','p02.txt','p03.txt','p04.txt','p05.txt'];
      const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar '+f);return (await r.text()).trim()}));
      const b64=parts.join('');
      const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!html.includes('SISTEMA INTEGRAL')&&!html.includes('Sistema Integral')) throw new Error('La integridad del paquete no pudo comprobarse.');
      document.open(); document.write(html); document.close();
    }catch(e){status.className='error';status.textContent='No se pudo iniciar la plataforma: '+e.message;document.querySelector('.bar').style.display='none';console.error(e)}
  })();
  </script>
</body>
</html>
