name: Inspect thesis auth flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tesis-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct thesis application source
        shell: bash
        run: |
          set -euo pipefail
          cat tesis-juridica-untrm/gz/g1.txt tesis-juridica-untrm/gz/g2.txt tesis-juridica-untrm/gz/g3.txt tesis-juridica-untrm/gz/g4.txt tesis-juridica-untrm/gz/g5.txt | tr -d '\n\r' > /tmp/tesis.b64
          base64 -d /tmp/tesis.b64 > /tmp/tesis.js.gz
          gzip -dc /tmp/tesis.js.gz > /tmp/tesis-source.js
          echo "SOURCE_BYTES=$(wc -c < /tmp/tesis-source.js)"
          node --check /tmp/tesis-source.js
      - name: Inspect authentication and boot flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/tesis-source.js').read_text(encoding='utf-8')
          needles=['signInWithPassword','signUp(','getSession','onAuthStateChange','renderAuth','authView','signOut','async function init','async function boot','function render','state.session','state.user']
          lines=s.splitlines()
          for needle in needles:
              print(f'\n===== {needle} =====')
              found=False
              for i,line in enumerate(lines,1):
                  if needle in line:
                      found=True
                      start=max(1,i-5); end=min(len(lines),i+12)
                      for j in range(start,end+1):
                          print(f'{j:04d}: {lines[j-1]}')
                      print('---')
              if not found:
                  print('NOT FOUND')
          PY
