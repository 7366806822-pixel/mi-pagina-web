name: Deploy LEX PERU 360 to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "lex-peru-360/**"
      - ".github/workflows/deploy-lex-peru-360-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "lex-peru-360-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          cp -R lex-peru-360/. _site/
          rm -f _site/bundle.html _site/bundle-compact.html _site/index-github.html _site/DEPLOYMENT.md _site/supabase_schema.sql
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/data.js
          test -f _site/app.js
          test "$(grep -o '\"number\"' _site/data.js | wc -l | tr -d ' ')" = "138"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
