name: Deploy Mi Día a Día to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build integrated standalone site
        run: |
          mkdir -p dist
          git show d5bf61a7c4fc9f4b394a7482f92368eb5bbdb642:app.gz > /tmp/mi-dia-a-dia.gz
          gzip -t /tmp/mi-dia-a-dia.gz
          gzip -dc /tmp/mi-dia-a-dia.gz > dist/index.html
          test -s dist/index.html
          grep -q 'MI DÍA A DÍA' dist/index.html
          grep -q 'cloudBtn' dist/index.html
          grep -q 'api.jsonstorage.net' dist/index.html
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
