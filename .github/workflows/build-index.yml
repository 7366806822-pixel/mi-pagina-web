name: Deploy Mi Día a Día to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'payload.part*'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct and verify integrated standalone site
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'b58071c01b1a78dee1b9f3ff7cd722506d0a1db93c74111c9ea43c47577c34f8' payload.part0 \
            '04fca7fe297a5226bbcc0dbd40f6cfd56a1a11795ad9dc9817b7a7aa6dc37fe0' payload.part1 \
            '0dbb4e476cd765fac50547f6137c8355866a5355d34f031697406cac95adef1e' payload.part2 \
            '1157ee260e53aa044878a0fa34b576550cc7d9b9e16892fe0f8e48feb76e7e67' payload.part3 | sha256sum -c -
          mkdir -p dist
          cat payload.part0 payload.part1 payload.part2 payload.part3 > /tmp/site.xz.b64
          base64 --decode /tmp/site.xz.b64 > /tmp/site.xz
          xz --test /tmp/site.xz
          xz --decompress --stdout /tmp/site.xz > dist/index.html
          test -s dist/index.html
          test "$(wc -c < dist/index.html)" -gt 180000
          grep -q 'MI DÍA A DÍA' dist/index.html
          grep -q 'cloudBtn' dist/index.html
          grep -q 'api.jsonstorage.net' dist/index.html
          grep -q 'viewport' dist/index.html
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
