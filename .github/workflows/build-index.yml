name: Build verified GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'payload.p*'
      - 'payload.part*'
      - 'patch_v8_to_v9.py'
      - 'patch_v8_to_v9_fixed.py'
      - 'patch_add_realtime.py'
      - 'patch_sidebar_toggle.py'
      - 'patch_google_calendar.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct original standalone site
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'c64cc6d75e9a6267b1e99b32d5c3c7dd6645e745973212822b1d3c9d256f6697' payload.p00 \
            '450bfd309fabed1092f133f7af7e96925368d7af3e1b89177f2026099fd3e745' payload.p01 \
            '5367d7ae1d611707c569fcba474e20d4b9fc9baf429e3ee7fc6a0f852fa43eac' payload.p02 \
            '2838ebbec6479d6fccfaac41be1e769b16c17040bcbe89230a939c7e8f930ec2' payload.p03 \
            '04fca7fe297a5226bbcc0dbd40f6cfd56a1a11795ad9dc9817b7a7aa6dc37fe0' payload.part1 \
            '0dbb4e476cd765fac50547f6137c8355866a5355d34f031697406cac95adef1e' payload.part2 \
            '1157ee260e53aa044878a0fa34b576550cc7d9b9e16892fe0f8e48feb76e7e67' payload.part3 | sha256sum -c -
          cat payload.p00 payload.p01 payload.p02 payload.p03 payload.part1 payload.part2 payload.part3 > /tmp/site.xz.b64
          base64 --decode /tmp/site.xz.b64 > /tmp/site.xz
          xz --test /tmp/site.xz
          xz --decompress --stdout /tmp/site.xz > /tmp/index.html
      - name: Apply Supabase central data layer
        run: python patch_v8_to_v9_fixed.py
      - name: Add bidirectional Realtime subscription
        run: python patch_add_realtime.py
      - name: Keep sidebar reversible
        run: python patch_sidebar_toggle.py
      - name: Integrate Google Calendar
        run: python patch_google_calendar.py
      - name: Verify production HTML
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/index.html)" -gt 180000
          grep -q 'MI DÍA A DÍA' /tmp/index.html
          grep -q 'SUPABASE_URL' /tmp/index.html
          grep -q '@supabase/supabase-js@2' /tmp/index.html
          grep -q 'mdd_upsert_item' /tmp/index.html
          grep -q 'postgres_changes' /tmp/index.html
          grep -q 'subscribeRealtime' /tmp/index.html
          grep -q 'MDD_SIDEBAR_REVERSIBLE_V1' /tmp/index.html
          grep -q 'Expandir menú' /tmp/index.html
          grep -q 'Alt+M' /tmp/index.html
          grep -Eq 'MDD_GOOGLE_CALENDAR_V(1|2)' /tmp/index.html
          grep -q 'googleCalendar:renderGoogleCalendar' /tmp/index.html
          grep -q 'Google Calendar' /tmp/index.html
          grep -q 'America/Lima' /tmp/index.html
          grep -q 'name="viewport"' /tmp/index.html
          ! grep -q 'api.jsonstorage.net' /tmp/index.html
          ! grep -q 'indexedDB' /tmp/index.html
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Publish verified files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B gh-pages origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/index.html index.html
          touch .nojekyll
          git add -A
          git commit -m 'Publish Supabase Realtime Mi Día a Día' || true
          git push origin gh-pages
