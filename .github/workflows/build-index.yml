name: Deploy Mi Día a Día to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'payload.part*'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct and verify integrated standalone site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat payload.part0 payload.part1 payload.part2 payload.part3 > /tmp/site.xz.b64
          base64 --decode /tmp/site.xz.b64 > /tmp/site.xz
          xz --test /tmp/site.xz
          xz --decompress --stdout /tmp/site.xz > dist/index.html
          test -s dist/index.html
          test "$(wc -c < dist/index.html)" -gt 180000
          grep -q 'MI DÍA A DÍA' dist/index.html
          grep -q 'cloudBtn' dist/index.html
          grep -q 'api.jsonstorage.net' dist/index.html
          grep -q 'viewport' dist/index.html
          touch dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
