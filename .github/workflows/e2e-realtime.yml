name: E2E public realtime verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-realtime.yml'
      - 'e2e-realtime-test.js'
      - 'e2e-sidebar-test.js'
      - 'e2e-calendar-test.js'
      - 'e2e-professional-ui-test.js'
      - 'patch_professional_ui.py'
      - 'patch_reference_ui.py'
      - 'patch_calendar_markmodified_compat.py'

jobs:
  test-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Verify public production page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --max-time 30 https://7366806822-pixel.github.io/mi-pagina-web/ -o /tmp/public.html
          grep -q 'Mi Día a Día — Tiempo Real' /tmp/public.html
          grep -q 'SUPABASE_URL' /tmp/public.html
          grep -q 'postgres_changes' /tmp/public.html
          grep -q 'realtimeReady' /tmp/public.html
          grep -q 'MDD_SIDEBAR_REVERSIBLE_V1' /tmp/public.html
          grep -q 'MDD_CALENDAR_PRO_V1' /tmp/public.html
          grep -q 'MDDCalendarPro' /tmp/public.html
          grep -q 'calendar-save-sync' /tmp/public.html
          grep -q 'MDD_PRO_UI_V1' /tmp/public.html
          grep -q 'MDD_PRO_UI_V1_JS' /tmp/public.html
          grep -q 'MDD_REFERENCE_UI_V2' /tmp/public.html
          grep -q 'MDD_REFERENCE_UI_V2_JS' /tmp/public.html
          grep -q 'mdd-digital-clock' /tmp/public.html
          grep -q 'clockSecond' /tmp/public.html
          grep -q 'setInterval(updateClock,1000)' /tmp/public.html
          grep -q 'MDD_CALENDAR_MARKMODIFIED_COMPAT_V1' /tmp/public.html
          grep -q 'Promise.resolve' /tmp/public.html
          grep -q 'Hora actual en Lima' /tmp/public.html
          ! grep -q 'api.jsonstorage.net' /tmp/public.html
          ! grep -q 'indexedDB' /tmp/public.html
      - name: Install Chromium test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test sidebar collapse and reopen
        run: node e2e-sidebar-test.js
      - name: Test reference-matched UI and realtime Lima digital clock
        run: node e2e-professional-ui-test.js
      - name: Test realtime CRUD persistence desktop and mobile
        run: node e2e-realtime-test.js
      - name: Test Calendar PRO views CRUD recurrence drag resize and mobile
        run: node e2e-calendar-test.js
      - name: Mark verified backend schema run
        run: echo 'Supabase, sidebar, realtime, Calendar PRO and reference-matched UI verified'
